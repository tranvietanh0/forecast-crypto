[project]
name = "forecast-crypto"
version = "0.1.0"
description = "Foundation for an event-driven crypto forecasting platform"
readme = "README.md"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
namespaces = true
include = ["contracts*", "services*", "apps*"]
